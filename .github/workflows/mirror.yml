name: Mirror to Codeberg

on:
  push:
  delete:
  workflow_dispatch:
  schedule:
    - cron: "17 4 * * 1" # weekly safety net in case an event-triggered run failed

jobs:
  mirror:
    uses: fiscusproject/.github/.github/workflows/mirror.yml@master
    # The reusable workflow clones this repo over public HTTPS and pushes to
    # Codeberg; it never uses GITHUB_TOKEN. Deny the default token scope rather
    # than inheriting whatever the repo/org default happens to be.
    permissions:
      contents: read
    # Pass only the one secret the reusable workflow declares, not `inherit`
    # (which would hand it every repo and org secret).
    secrets:
      CODEBERG_TOKEN: ${{ secrets.CODEBERG_TOKEN }}
